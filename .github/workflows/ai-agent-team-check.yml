name: AI Agent Team Checks
on:
  push:
    branches: [AI-Agent-Team]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check policy files
        run: |
          test -s ai-agent-team/README.md
          test -s ai-agent-team/AGENTS.md
          test -s ai-agent-team/TASK_POLICY.md
      - name: Test task router and cost guardrails
        run: node --test ai-agent-team/*.test.mjs
